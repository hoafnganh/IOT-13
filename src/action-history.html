<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./assets/css/fonts.css">
    <link rel="stylesheet" href="./assets/css/common.css">
    <link rel="stylesheet" href="./assets/css/dashboard.css">
    <link rel="stylesheet" href="./assets/css/table.css">
    <title>Action History - Hệ thống IoT</title>
</head>
<body>
    <div class="wrap-all">

        <!-- ================= SIDEBAR ================= -->
        <aside id="sidebar">
            <header class="header-sidebar">
                <span>Sensor monitor</span>
            </header>

            <nav class="nav-content">
                <button class="nav-btn" data-page="0">Dashboard</button>
                <button class="nav-btn" data-page="1">Data Sensor</button>
                <button class="nav-btn active" data-page="2">Action History</button>
                <button class="nav-btn" data-page="3">Profile</button>
            </nav>

            <footer class="footer-sidebar">
                <div class="user-small">
                    <div class="avatar">D</div>
                    <div class="user">
                        <b>Dương Hoàng Anh</b>
                        <span>B23DCAT007</span>
                    </div>
                </div>
                <button class="logout-btn">Đăng xuất</button>
            </footer>
        </aside>

        <!-- ================= CONTENT ================= -->
        <div class="content">

            <header class="topbar">
                <div>
                    <h1>Action History</h1>
                    <p>Theo dõi lệnh điều khiển và kết quả phản hồi</p>
                </div>
                <div class="system-online is-online">
                    <span class="status-dot"></span>
                    <span id="espStatusText">Đang kiểm tra ESP8266...</span>
                </div>
            </header>

            <main class="table-page">

                <!-- Bo loc:
                     - Chon Thiết bị / Action / Status -> them dropdown gia tri ben canh,
                       chon gia tri la loc ngay (khong can nhan Tim).
                     - Thanh tim kiem chuoi luon hien va mac dinh chi loc theo Thoi gian. -->
                <section class="filter-panel">
                    <div class="filter-item">
                        <label for="filterType">Loại tra cứu</label>
                        <select id="filterType">
                            <option value="">Chọn loại tra cứu</option>
                            <option value="device">Thiết bị</option>
                            <option value="action">Action</option>
                            <option value="status">Status</option>
                            <!-- <option value="time">Thời gian</option> -->
                        </select>
                    </div>

                    <!-- Dropdown gia tri: chi hien khi chon Thiết bị / Action / Status -->
                    <div class="filter-item" id="valueItem" style="display: none;">
                        <label for="valueSelect">Giá trị</label>
                        <select id="valueSelect"></select>
                    </div>

                    <!-- Thanh tim kiem chuoi: mac dinh loc theo Thoi gian -->
                    <div class="filter-item search-item">
                        <label for="typeSearch">Thời gian</label>
                        <input type="text" id="typeSearch" autocomplete="off"
                               placeholder="VD: 2026-10-14 hoặc 20:15">
                    </div>

                    <div class="filter-buttons">
                        <button type="button" class="reset-btn">Đặt lại</button>
                    </div>
                </section>

                <!-- Bang du lieu -->
                <section class="data-table-card">
                    <header class="table-header">
                        <h2>Lịch sử thao tác</h2>
                        <span>Phản hồi mới nhất: <span id="lastResponse">--</span></span>
                    </header>

                    <div class="table-content">
                        <table class="data-table action-table">
                            <thead>
                                <tr>
                                    <th>ID</th>
                                    <th>Device ID</th>
                                    <th>Tên thiết bị</th>
                                    <th>Action</th>
                                    <th>Status</th>
                                    <th>User</th>
                                    <th>Thời gian gửi</th>
                                    <th>Phản hồi</th>
                                    <th>Độ trễ</th>
                                </tr>
                            </thead>
                            <tbody></tbody>
                        </table>
                    </div>

                    <footer class="table-footer">
                        <div class="record-limit">
                            <span>Hiển thị</span>
                            <select id="recordLimit">
                                <option value="10">10</option>
                                <option value="20">20</option>
                                <option value="50">50</option>
                            </select>
                            <span>bản ghi</span>
                        </div>
                        <nav class="pagination" id="pagination"></nav>
                    </footer>
                </section>

            </main>
        </div>

    </div>
</body>
<script src="./assets/js/core.js"></script>
<script src="./assets/js/table-render.js"></script>
<script src="./assets/js/action-history.js"></script>
</html>
